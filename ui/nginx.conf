server {
    listen 80;
    server_name _;
    client_max_body_size 350m;

    root /usr/share/nginx/html;
    index index.html;

    # Don't cache the SPA shell — there's only one, vue-router handles
    # /security/* on the client.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # nemo backend (FastAPI).
    location /api/ {
        proxy_pass http://nemo-backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # User-uploaded media (FastAPI StaticFiles).
    location /media/ {
        proxy_pass http://nemo-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }

    # Staff endpoints (ported security-server) — same backend process,
    # mounted under /security-api/api/*. Forwarded transparently.
    location /security-api/ {
        proxy_pass http://nemo-backend:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-cache static assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single SPA fallback — vue-router serves both / and /security/*.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
