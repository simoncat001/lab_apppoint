apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nemo-backend-media
  namespace: nemo
spec:
  # JuiceFS supports RWX, so backend can scale horizontally without
  # collisions. If you replace JuiceFS with a RWO storage class, switch
  # this back to ReadWriteOnce and the Deployment strategy to Recreate.
  accessModes: ["ReadWriteMany"]
  storageClassName: juicefs-sc
  resources:
    requests:
      storage: 50Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemo-backend
  namespace: nemo
  labels:
    app: nemo-backend
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: nemo-backend
  template:
    metadata:
      labels:
        app: nemo-backend
    spec:
      containers:
        - name: backend
          image: harbor.local:8088/oppointments-system/nemo-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: nemo-backend-config
            - secretRef:
                name: nemo-backend-secret
          volumeMounts:
            - name: media
              mountPath: /app/media
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8000
            timeoutSeconds: 5
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: nemo-backend-media
---
apiVersion: v1
kind: Service
metadata:
  name: nemo-backend
  namespace: nemo
spec:
  selector:
    app: nemo-backend
  ports:
    - port: 8000
      targetPort: 8000
