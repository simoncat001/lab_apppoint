apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemo-ui
  namespace: nemo
  labels:
    app: nemo-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nemo-ui
  template:
    metadata:
      labels:
        app: nemo-ui
    spec:
      containers:
        - name: ui
          image: harbor.local:8088/oppointments-system/nemo-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: nginx-conf
          configMap:
            name: nemo-ui-nginx
            items:
              - key: default.conf
                path: default.conf
---
apiVersion: v1
kind: Service
metadata:
  name: nemo-ui
  namespace: nemo
spec:
  type: NodePort
  selector:
    app: nemo-ui
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
